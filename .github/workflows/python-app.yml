# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        # Matches the Dockerfile; pinned numpy versions need 3.11+
        python-version: "3.11"
    - name: Install dependencies
      run: |
        # setuptools comes with the runner's Python; 79.x has PYSEC-2026-3447 (fixed in 83)
        python -m pip install --upgrade pip setuptools
        pip install flake8 pip-audit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Audit dependencies for known vulnerabilities
      run: |
        # Audits what the app ships - requirements.txt and everything it pulls in - not the CI
        # runner's own tools. Fails the build on any known advisory.
        # Triage by reachability; to defer one, add --ignore-vuln <ID> with a comment and review date.
        pip-audit -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run tests
      run: |
        # The tests are assert-based scripts (no pytest functions), so run each one directly -
        # pytest collected nothing and exited 5, which failed every build.
        for t in test_*.py; do echo "== $t"; python "$t"; done
