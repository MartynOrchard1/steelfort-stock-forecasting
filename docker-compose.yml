# Example: run the Steelfort Stock Forecasting app as a standalone service
# on the network. See the project plan doc for the full rollout checklist
# (static IP, firewall rules, intranet link).
#
# Usage on the server:
#   docker compose up -d --build
#   docker compose logs -f      # check it started cleanly
#   docker compose ps           # confirm it's up and "healthy"
#
# After a code change:
#   docker compose up -d --build

services:
  stock-app:
    build:
      context: .
      dockerfile: "Dockerfile - Copy"
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Real secrets.toml lives only on the server, never in the image.
      # Create it once on the server from .streamlit/secrets.toml.example.
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro

    # Once the app is updated to read the NetSuite/TIMS MySQL view directly
    # instead of file uploads, uncomment this - copy .env.example to .env
    # first and fill in the real read-only DB credentials (DB_HOST,
    # DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_VIEW). .env is gitignored
    # and dockerignored, so it never gets committed or baked into the image.
    #
    # env_file:
    #   - .env
